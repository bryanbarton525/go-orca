apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-orca-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-orca-smoke
  template:
    metadata:
      labels:
        app: go-orca-smoke
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: go-orca-smoke:local
          imagePullPolicy: IfNotPresent
          args: ["-config", "/config/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: go-orca-smoke
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
